# tcp.yaml - TCP (tool centre point) offset for the teleoperation target, in metres.
#
# What it does
# ------------
# The headset commands a tool centre point, not the flange. `tcp_offset` is the
# vector from the planning tip link (`tip_link`, ee_link) to that point,
# expressed in the tip frame - so the default points along the tool axis.
#
# The offset is applied on both sides of the increment mapping, which is what
# makes it a frame rather than a fudge factor:
#   * the measured tip pose is moved to the TCP before the headset increment is
#     applied, so the anchor is the TCP the operator sees;
#   * the resulting target is moved back to the tip pose before inverse
#     kinematics, because that is the frame the solver plans for.
# Changing this value therefore changes which point of the tool follows the hand,
# not the gain of the mapping.
#
# Default
# -------
# 0.18 m, the gripper's flange-to-grasp-point distance for the current tool.
# Set it to 0.0 to teleoperate the flange itself.
vr_teleop:
  ros__parameters:
    tcp_offset: [0.0, 0.0, 0.18]
