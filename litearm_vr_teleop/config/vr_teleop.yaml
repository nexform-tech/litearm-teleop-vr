# vr_teleop.yaml - parameters for the two nodes this stack starts.
#
# Note that neither node decides how fast the arm may move. That belongs to the
# controller (max_velocity in vr_controllers.yaml) and to the firmware, so a
# mistake in this file cannot raise the speed limit of the hardware.

headset_link:
  ros__parameters:
    # 0.0.0.0 because the headset is a separate device on the local network; it
    # connects to ws://<this machine>:8765. A genuine network exposure, so it is
    # stated here rather than buried: the link accepts frames from anything that
    # can reach the port. Bind 127.0.0.1 to require a tunnel.
    host: 0.0.0.0
    port: 8765
    frame_topic: /vr_controller_frame
    # How often to say whether frames are arriving. A headset that is connected
    # but silent is the most confusing failure of a link like this, and it is
    # indistinguishable from an arm that has stopped following for other reasons.
    report_period_s: 10.0

vr_teleop:
  ros__parameters:
    frame_topic: /vr_controller_frame
    joint_state_topic: /joint_states
    command_topic: /vr_forward_controller/commands

    # The control loop runs at this rate regardless of the headset's rate. It
    # paces two things, and both are deliberate: the command stream published to
    # the controller, and the tick on which the hand's motion is folded into the
    # Cartesian target. Between two headset frames the target keeps being advanced
    # by the increment the frames so far describe, which is idempotent in the
    # sense that matters here - the target is an absolute pose derived from the
    # operator's displacement, so re-solving cannot accumulate motion - so a rate
    # above the headset's is not wasted work and a rate below it does not lose
    # motion. Ticking the target here rather than on each arrival is what keeps
    # the link's timing out of the stream: a step sized by an arrival is sized by
    # however long that arrival took.
    control_rate_hz: 100.0

    joint_names: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]

    # The teleoperation start pose, in radians. These are the `grasp_ready`
    # values in litearm_vr_moveit_config/srdf/litearm_vr.srdf.xacro; the SRDF
    # makes the pose nameable for MoveIt, this makes it reachable without a
    # planner. The two copies have to move together.
    start_pose: [0.0, -0.645772, 0.0, -1.989675, 0.0, -0.837758, 0.0]
    # A quarter of the arm's rated joint speed. This move happens before the
    # operator is following anything, so it is the one motion nobody is watching.
    start_pose_speed: 0.5
    start_pose_accel: 3.0

    # Which inverse kinematics backend. Both are implemented and either can be
    # selected at any time; see the class documentation in teleop_planner.hpp.
    #   dls     damped least squares implemented in this package, on top of the
    #           MoveIt core's forward kinematics and Jacobian. Predictable latency,
    #           in process, and deterministic - which is what a following task
    #           wants, and why it is the default. It is also the solver the
    #           velocity form uses whatever this says, since that path has no
    #           plugin in it at all.
    #   plugin  the solver named below, loaded through pluginlib. Reuses the
    #           MoveIt configuration, at the cost of a latency this node does not
    #           control (the configuration budgets 0.2 s per call). Kept because a
    #           rig may want the solver it already tuned, and because the two can
    #           be compared on the same arm.
    ik_backend: dls

    # 当雅可比的最小奇异值低于这个数时，改用本包的阻尼最小二乘后端求解（0 = 关闭）。
    #
    # 插件后端（SNS）在奇异位形附近解不再是目标的连续函数：手的几毫米位移可以让某个
    # 关节跳半弧度，往上往下概率相当 —— 操作员会发现某个方向"压不下去"。阻尼后端在同
    # 一片区域里是连续的，代价是它接受的残差更大，所以每次切换都会打一条 WARN。
    # 这里判定用的是"种子点"处的奇异值，与求解用的种子一致。
    damping_singular_value: 0.05
    group_name: litearm_arm
    base_frame: base_link
    tip_link: ee_link

    # Acceptance of a solution, measured by running forward kinematics on it. A
    # solution outside this is treated as no solution and the arm holds. Ported
    # from the reference implementation: 3 mm and 0.05 rad.
    ik_position_tolerance: 0.003
    ik_rotation_tolerance: 0.05

    # Damped least squares, used only when ik_backend is dls.
    dls_damping: 0.05
    dls_null_space_gain: 0.2
    dls_max_iterations: 120
    dls_max_step_rad: 0.2

    # Only used for logging: a Jacobian minimum singular value below this is
    # reported so that an unreachable target can be attributed to conditioning
    # rather than to geometry.
    singularity_warning_threshold: 0.02

    # Increment mapping and joint filter, ported from the reference.
    # max_step_rad is the absolute ceiling on one cycle's joint step, the floor
    # under an inverse kinematics jump; max_joint_velocity is the normal rate
    # limit; low_pass_tau removes the high frequency part that headset tracking
    # noise contributes after the solver amplifies it.
    max_step_rad: 0.08
    max_joint_velocity: 2.0
    low_pass_tau: 0.02
    # Samples in the moving average of the hand's increment. One sample is one
    # control tick, so this is 100 ms of smoothing at the control rate below and
    # it does not stretch when the headset slows down - which it used to, since
    # the samples were headset frames: ten of them were 139 ms at the measured
    # 72 Hz and 278 ms on a link that had dropped to 36 Hz. Set 14 for the
    # measured 139 ms.
    moving_average_samples: 10

    # Which control law follows the hand.
    #
    #   velocity  the hand's twist goes through the damped Jacobian, then a low
    #             pass, then an acceleration and speed ceiling, and the position
    #             written beside the velocity is that speed integrated at the
    #             control rate. MoveIt Servo's arrangement, and the default: on
    #             this arm the velocity field is what the firmware reads as the
    #             slew ceiling of its position reference, so the loop hands it a
    #             number it computed this cycle instead of a difference of two
    #             positions for the controller to reconstruct. Nothing in this
    #             path goes through a kinematics plugin, so the target is as fresh
    #             as the tick rather than as fresh as the solver.
    #
    #   position  the previous behaviour: an absolute Cartesian target, solved by
    #             the configured plugin on its own thread, with the joint filter
    #             easing towards the answer. Targets the arm cannot reach are
    #             refused and held rather than integrated, and `reference_pose`
    #             decides whether a target that was not delivered is carried.
    #
    # Both are supported and either can be selected at any time; they can be
    # compared on the same rig without a rebuild, which is the only honest way to
    # choose between them.
    follow_mode: velocity

    # Velocity mode: time constant of the low pass on the commanded joint speed,
    # seconds. Servo carries the same filter as `low_pass_filter_coeff`, a per
    # iteration coefficient; a time constant is used here because this loop
    # measures its interval, and a coefficient would mean a different cutoff every
    # time a tick ran late. Zero turns the smoothing off and leaves the
    # acceleration ceiling below to shape the command on its own.
    velocity_filter_tau: 0.03

    # Velocity mode: how far the integrated reference may run ahead of the arm,
    # radians per joint. The joint space counterpart of max_target_lead_m below,
    # and it is needed for the same reason plus one: the velocity form integrates,
    # so an arm that lags leaves the reference further ahead every cycle, and an
    # operator who keeps pushing while the arm cannot follow would wind it out to
    # a joint limit. The command is scaled down - whole, not joint by joint, so
    # the direction survives - as the worst joint approaches this. Zero or less
    # disables the guard.
    max_joint_lead_rad: 0.2

    # The motion profile of the command stream: how fast a joint may move, how
    # fast that speed may change, and how fast the change of speed may change.
    #
    # These exist because of what the firmware does with the velocity the
    # controller writes - it is the slew ceiling of the position reference - so a
    # command stream whose speed steps asks the firmware for a step in speed, and
    # the field ends up pinned at its ceiling. Bounding the acceleration and then
    # the jerk turns that stream into a curve the firmware can follow, at the cost
    # of the arm taking a little longer to reach a new target: with the defaults,
    # a rated 2 rad/s is reached in 0.1 s and full acceleration in 20 ms.
    #
    # The jerk ceiling is high on purpose: it softens the ends of a move, and a
    # lower one also delays the deceleration, which makes the arm overshoot its
    # target instead of approaching it. Tune max_joint_acceleration first; it is
    # the number the operator feels. They are a starting point, not measurements.
    max_joint_acceleration: 20.0
    max_joint_jerk: 1000.0

    # What the hand's increment is measured against.
    #
    #   measured   the pose forward kinematics reports, so every frame starts
    #              from where the arm actually is. A target the arm did not
    #              reach is dropped rather than carried, which is why nothing
    #              accumulates - including the operator's motion while the arm
    #              lags. This is the behaviour so far.
    #   commanded  the last commanded pose, so the arm's shortfall is carried
    #              into the next frame and delivered as soon as the arm can take
    #              it. This is what restores the tracking ratio on a plant that
    #              lags: on the fake firmware the end effector otherwise delivers
    #              a small fraction of the hand's motion, and the operator
    #              experiences that as "I have to move my hand a long way before
    #              the arm does anything".
    #
    # `commanded` is the default, and the reason is a measurement rather than a
    # preference. In `measured` mode the target is rebuilt every frame from the
    # pose the arm is actually in, and on this stack the arm's pose follows the
    # command - so the residual of the inverse kinematics (a few tenths of a
    # millimetre, which is ordinary for an iterative solver) is fed back into the
    # next frame's target. That closes a loop with no damping in it: measured on
    # the mock hardware with the operator's hand held still, every joint stood
    # there oscillating peak to peak by 0.6 to 3.7 mrad, changing direction on
    # nearly every frame, which is the sawtooth a position plot shows as a
    # regular ripple. With the reference on the commanded pose the same
    # measurement is 0.00000 rad on every joint: the target no longer contains
    # the solver's residual, and the operator's own motion accumulates instead.
    #
    # The cost is the mirror image of the benefit: with it on, the target can
    # collect motion the arm has not delivered yet. That is exactly what
    # `max_target_lead_m` / `_rad` bound - beyond that lead the target is pulled
    # back onto the arm, keeping the direction the operator asked for - and the
    # grip release clears it. Use `measured` if the arm must never collect any.
    reference_pose: commanded
    max_target_lead_m: 0.15
    max_target_lead_rad: 0.6

    # Smallest target change worth re-solving the inverse kinematics for:
    # 0.5 mm and 0.5 mrad are below anything an operator asks for, and a
    # stationary controller's tracking noise sits below them. Zero disables both.
    #
    # Read the cost before raising them in the `measured` mode: an increment
    # below the deadband is not accumulated, it is dropped, so the deadband acts
    # as a velocity threshold of deadband / tick period (0.5 mm at the 100 Hz
    # tick is 5 cm/s). That is why both default to zero. With `reference_pose:
    # commanded` the increments do accumulate and a deadband of a few tenths of
    # a millimetre is safe and useful.
    target_deadband_m: 0.0
    target_deadband_rad: 0.0

    # Which control logic the hand's motion is read in. Two of them, and this key
    # is the only thing that changes between them; each carries its own rotation
    # calibration below, because the two read the same three numbers in different
    # frames and a mirror that is right in one is wrong in the other.
    #
    #   base_link  the controller's rotation increment is carried into the robot
    #              base frame and applied there, so the tool turns about the same
    #              world axis the controller turned about, by the same angle,
    #              whatever pose the arm is in and however the controller is held.
    #              This is the default, and the one this rig is calibrated for.
    #   tool       the increment is read in the controller's own frame and applied
    #              in the tool's own frame, so the tool copies the hand axis for
    #              axis. That is the same motion only while the tool's frame and
    #              the controller's frame stand in one particular relation - the
    #              pose the tool calibration below was measured at - and any other
    #              wrist roll hands the operator a response rotated by the
    #              difference.
    #
    # Live, like the calibrations: the person who can tell whether a direction is
    # right is the one holding the controller, so either can be changed while the
    # node runs and the change takes effect on the next headset frame (until then
    # the arm holds the pose it had):
    #
    #   ros2 param set /vr_teleop control_frame tool
    #   ros2 param set /vr_teleop base_link_rotation_signs "[-1.0, -1.0, 1.0]"
    control_frame: base_link

    # Per axis sign applied to the rotation vector, in the frame the selected
    # control logic reads in: robot base axes for base_link, tool axes for tool.
    #
    # Each is that logic's own calibration and nothing else - the mapping carries
    # the hand's motion, these say which way each of its three directions points on
    # this rig - so they are independent by construction rather than by convention.
    #
    # base_link, measured here: raising the controller tilted the tool down and
    # lowering it tilted the tool up, and leaning the controller left and right
    # tilted it the other way as well, so the rotations about the robot's x (the
    # operator's left-right axis) and y (their forward axis) are mirrored. The two
    # that are mirrored and the one that is not are worth naming: diag(-1,-1,1) is
    # a half turn about z, not a mirror, which is what an operator standing on the
    # far side of the arm from where the baseline was measured sees. So the
    # TRANSLATION has to be checked too, because the same correspondence carries it
    # (singleArmUprightMapping in teleop_math.cpp): if pushing the controller
    # forward moves the tool backward, the correspondence is the thing to fix and
    # these two signs must come back to 1.0 - correcting both corrects twice.
    #
    # tool, the reference implementation's measured baseline: the controller's
    # axes read as the tool's, which is the previous behaviour this key restores.
    base_link_rotation_signs: [-1.0, -1.0, 1.0]
    tool_rotation_signs: [1.0, -1.0, -1.0]

    # The point of the tool the operator commands, as an offset from the planning
    # tip link (tip_link, ee_link) in the tip frame, in metres. The headset commands
    # a tool centre point, not the flange; 0.18 m is this gripper's
    # flange-to-grasp-point distance, and 0.0 teleoperates the flange itself.
    #
    # It is applied on both sides of the increment mapping, which is what makes it a
    # frame rather than a fudge factor: the measured tip pose is moved to the TCP
    # before the hand's increment is applied, so the anchor is the TCP the operator
    # sees, and the resulting target is moved back to the tip pose before the
    # inverse kinematics, because that is the frame the solver plans for. Changing
    # it changes which point of the tool follows the hand, not the gain.
    tcp_offset: [0.0, 0.0, 0.18]

    # Freeze when the headset goes quiet. Deliberately much shorter than the
    # controller's own staleness timeout: this node knows more than the controller
    # does (it knows a link exists and how old the last frame is), so the
    # fast, informed decision belongs here.
    headset_timeout_s: 0.5

    gripper_enabled: true
    gripper_action: /gripper_controller/gripper_cmd
    # 0.07479 m is the widest opening the gripper's driver red lines allow. The
    # mechanism travels to 0.087 m but the driver clamps anything above 0.07479,
    # and because a stalled gripper counts as success the clamp would be silent:
    # asking for 0.087 would just open 12.2 mm less than requested, with nothing
    # reported.
    gripper_open_position: 0.07479
    gripper_close_position: 0.0
    gripper_max_effort: 3.5

    # How far the trigger has to fall below the threshold before that counts as a
    # release. One threshold on an analogue input that rests near it oscillates: on
    # this rig a trigger nobody was touching produced an open/close pair every half
    # second. Zero restores the bare threshold.
    trigger_hysteresis: 0.1

    # Trigger analogue threshold, debounce, and a floor on how long a close lasts.
    # Operators release the trigger while the fingers are still travelling; without
    # the floor the gripper would reopen before it had a chance to hold anything.
    trigger_threshold: 0.5
    trigger_debounce_s: 0.05
    min_close_s: 0.5

    # The solver, and where it reads its own tuning. The plugin looks for
    #   <group_name>.kinematics_solver   for its class, and
    #   <group_name>.solver_type / loop_period / eps / timeout   for its behaviour.
    #
    # These five values are the same ones as in
    # litearm_vr_moveit_config/config/kinematics.yaml. They are repeated here
    # rather than read from there because a MoveIt kinematics file has no node
    # name at its top level and cannot be handed to a node as a parameter file;
    # wrapping it would be a copy with a file in between. The duplication is
    # guarded by test/test_kinematics_consistency.py, which fails if the two
    # drift apart.
    litearm_arm:
      kinematics_solver: sns_ik_kinematics_plugin::SnsIkKinematicsPlugin
      solver_type: SNS
      loop_period: 0.005
      eps: 1.0e-5
      timeout: 0.2
