# joint_limits.yaml — joint limits used by MoveIt planning.
#
# The values come from the litearm-stm32 firmware parameter table
# (User/litearm/params/defaults.c and joint_limit_macros.h), not from the raw
# URDF values: the firmware limits are deliberately narrowed by 1 degree as an
# engineering safety margin. Matching MoveIt's planning space to the firmware's
# runtime envelope keeps the planner from producing motion the firmware rejects.
#
# The jerk limits feed AddRuckigTrajectorySmoothing (double S curve). Without
# them Ruckig falls back to its own defaults, which do not match the S curve
# envelope of the firmware's move_j.
#
# In litearm_moveit_config this file is generated by
# tools/gen_from_firmware_config.py; it is reproduced here with the values
# unchanged.
#
# Note: only the arm joints are listed. The gripper joint
# (gripper_opening_joint) is not planned against these limits; its limit comes
# from the URDF and its velocity ceiling from the driver's own rate limit.

joint_limits:
  joint1:
    has_position_limits: true
    min_position: -2.809547
    max_position: 2.809547
    has_velocity_limits: true
    max_velocity: 2.000000
    has_acceleration_limits: true
    max_acceleration: 8.000000
    has_jerk_limits: true
    max_jerk: 160.000000

  joint2:
