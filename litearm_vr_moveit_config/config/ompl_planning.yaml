# ompl_planning.yaml — OMPL planning pipeline configuration.
#
# planning_plugin (singular) cannot be omitted
# --------------------------------------------
# MoveIt 2's PlanningPipeline accepts both a singular "planning_plugin" and a
# plural "planning_plugins" parameter. With only the plural form some load paths
# fall back to the built in default chomp_interface/CHOMPPlanner and log
#
#     Multiple planning plugins available. You should specify the
#     '~planning_plugin' parameter. Using 'chomp_interface/CHOMPPlanner' for now.
#
# CHOMP has no parameters configured here, so planning then "succeeds" with an
# empty trajectory (error_code 1, planning_time 0, zero waypoints), which is very
# hard to track down. Setting both keys is the robust form.
planning_plugin: ompl_interface/OMPLPlanner
planning_plugins:
  - ompl_interface/OMPLPlanner

# Request adapters: the order matters, and it matters in the counterintuitive
# direction.
#
# The adapter chain is assembled in
# moveit_core/planning_request_adapter/planning_request_adapter.cpp:
#     for (int i = adapters_.size() - 1; i >= 0; --i) fn = wrap(adapters_[i], fn);
#
# Wrapping runs backwards from the end of the list, so adapters_[0] ends up
# outermost: it preprocesses first and postprocesses last. List order is
# therefore the preprocessing order, and the postprocessing order is its reverse.
#
# Two consequences:
#   1. AddTimeOptimalParameterization first in the list means time
#      parameterization is applied last, which is correct.
#   2. Ruckig documents that it has to run after a time parameterization
#      algorithm, so it has to be listed BEFORE
#      AddTimeOptimalParameterization. Listed after it, Ruckig's output is
#      overwritten wholesale by the parameterization that follows, so it has no
#      effect at all.
#
# Also note that AddTimeOptimalParameterization is documented as "not jerk
# limited", while Ruckig is jerk limited (double S curve). Chaining them gives
# both time optimality and jerk limiting. The jerk ceilings come from
# config/joint_limits.yaml.
#
# The FixStartState family is pure preprocessing: it pulls the start and goal
# states back into the valid region (out of bounds, in self collision, outside
# the workspace bounds) and is the most frequent cause of "planning always
# fails".
request_adapters: >-
  default_planner_request_adapters/AddRuckigTrajectorySmoothing
  default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints

start_state_max_bounds_error: 0.1

planner_configs:
  RRTConnectkConfigDefault:
    type: geometric::RRTConnect
    range: 0.0
  RRTstar:
    type: geometric::RRTstar
    range: 0.0
    goal_bias: 0.05
    delay_collision_checking: 1
  PRM:
    type: geometric::PRM
    max_nearest_neighbors: 10
  ESTkConfigDefault:
    type: geometric::EST
    range: 0.0
    goal_bias: 0.05

litearm_arm:
  # RRTConnect is the steadiest choice for a 7 axis redundant serial chain, so it
  # is the default.
  default_planner_config: RRTConnectkConfigDefault
  planner_configs:
    - RRTConnectkConfigDefault
    - RRTstar
    - PRM
    - ESTkConfigDefault
  # The first two joints (shoulder) work best as projection evaluator for this
  # chain's configuration space coverage.
  projection_evaluator: joints(joint1,joint2)
  longest_valid_segment_fraction: 0.01
