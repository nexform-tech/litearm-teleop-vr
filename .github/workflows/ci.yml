# Test gate for the LiteArm VR teleoperation stack.
#
# Tests live in their own workflow: they run on pull requests, while the release
# workflow runs on pushes to the default branch. Mixing the two means a broken
# release blocks a pull request, or the reverse.
#
# The repository is one directory inside a colcon workspace, so the two sibling
# packages this one is built and tested against are checked out next to it:
# litearm-description, which litearm_vr_moveit_config detects at configure time,
# and litearm-moveit2, whose SRDF the consistency test expands. The remaining
# dependencies are ROS packages installed by name rather than through rosdep,
# because the sibling packages are deliberately not rosdep keys.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a superseded pull request run is pointless

jobs:
  # The job must be named `test`: that is the required status check.
  test:
    # Humble targets Ubuntu 22.04.
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: ws/src/litearm-teleop-vr

      # litearm_vr_moveit_config looks for the arm description in the ament index
      # at configure time and reads its URDF, so it has to be in the workspace.
      - name: Checkout litearm-description
        uses: actions/checkout@v4
        with:
          repository: nexform-tech/litearm-description
          path: ws/src/litearm-description

      # The SRDF of the merged robot includes litearm_moveit_config's collision
      # matrix, which the start pose test expands through xacro.
      - name: Checkout litearm-moveit2
        uses: actions/checkout@v4
        with:
          repository: nexform-tech/litearm-moveit2
          path: ws/src/litearm-moveit2

      # The launch argument test opens litegrip_ros2_control's own xacro and
      # compares the component arguments the launch file sets against the ones
      # the component reads, so that package has to be in the workspace - and it
      # is built on the gripper's SDK.
      - name: Checkout litegrip-ros2
        uses: actions/checkout@v4
        with:
          repository: nexform-tech/litegrip-ros2
          path: ws/src/litegrip-ros2

      - name: Checkout litegrip-cpp
        uses: actions/checkout@v4
        with:
          repository: nexform-tech/litegrip-cpp
          path: ws/src/litegrip-cpp

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            git \
            libeigen3-dev \
            python3-colcon-common-extensions \
            python3-pytest \
            python3-yaml \
            ros-humble-xacro \
            ros-humble-ament-cmake \
            ros-humble-ament-cmake-gtest \
            ros-humble-ament-cmake-pytest \
            ros-humble-ament-cmake-python \
            ros-humble-builtin-interfaces \
            ros-humble-control-msgs \
            ros-humble-controller-interface \
            ros-humble-forward-command-controller \
            ros-humble-geometry-msgs \
            ros-humble-hardware-interface \
            ros-humble-moveit-core \
            ros-humble-moveit-msgs \
            ros-humble-pluginlib \
            ros-humble-rclcpp \
            ros-humble-rclcpp-lifecycle \
            ros-humble-realtime-tools \
            ros-humble-rosidl-default-generators \
            ros-humble-rosidl-default-runtime \
            ros-humble-sensor-msgs \
            ros-humble-srdfdom \
            ros-humble-std-msgs \
            ros-humble-std-srvs \
            ros-humble-tf2-ros \
            ros-humble-urdf \
            ros-humble-visualization-msgs

      - name: Build
        shell: bash
        working-directory: ws
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+

      - name: Test
        shell: bash
        working-directory: ws
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --event-handlers console_direct+
          # `colcon test` reports success even when a test fails; this is the gate.
          colcon test-result --verbose

  # Repository standards and documentation. A separate job so that a broken build
  # and a lint failure are distinguishable at a glance.
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint Markdown
        run: |
          npx --yes markdownlint-cli2@0.23.3 \
            "README.md" "README.zh-CN.md" \
            "docs/*.md" \
            "litearm_vr_teleop/README.md" "litearm_vr_teleop/README.zh.md" \
            "litearm_vr_moveit_config/README.md" "litearm_vr_moveit_config/README.zh.md"

      - name: Validate repository standards
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          test -s docs/quickstart.md
          test -s docs/quickstart.zh-CN.md
          python3 -c "import json; json.load(open('.releaserc.json'))"
          python3 -c "import json; json.load(open('.markdownlint.json'))"
          for manifest in litearm_vr_teleop/package.xml litearm_vr_moveit_config/package.xml; do
            python3 -c "import xml.dom.minidom, sys; xml.dom.minidom.parse(sys.argv[1])" "$manifest"
          done
          echo "repository standards OK"
